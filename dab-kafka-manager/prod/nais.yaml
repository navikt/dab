kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: dab-kafka-manager
  namespace: dab
  labels:
    team: dab
spec:
  image: europe-north1-docker.pkg.dev/nais-management-233d/poao/kafka-manager:2026.04.13-13.33-52e9b29
  port: 8080
  ingresses:
    - https://dab-kafka-manager.intern.nav.no
  prometheus:
    enabled: true
    path: /internal/prometheus
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
  replicas:
    min: 1
    max: 1  # 1 instance is required since in-memory session management is used
    cpuThresholdPercentage: 75
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 512Mi
  azure:
    application:
      enabled: true
      tenant: nav.no
      claims:
        groups:
          - id: dfc550d0-c5bf-4208-8b2b-3542bb8b5b15 # entra id group dab
  kafka:
    pool: nav-prod
  env:
    - name: APP_CONFIG_JSON
      value: '{{{appTopicConfig}}}'
